<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0369a1"/>
      <stop offset="100%" style="stop-color:#0c8ee6"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Pattern overlay -->
  <g opacity="0.05" fill="white">
    <circle cx="100" cy="100" r="80"/>
    <circle cx="1100" cy="530" r="120"/>
    <circle cx="200" cy="500" r="60"/>
  </g>
  <!-- Logo area -->
  <rect x="80" y="220" width="100" height="100" rx="20" fill="white"/>
  <text x="130" y="290" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="60" font-weight="bold" fill="#0c8ee6">B</text>
  <!-- Company name -->
  <text x="200" y="290" font-family="system-ui, -apple-system, sans-serif" font-size="56" font-weight="bold" fill="white">BRITZMEDI</text>
  <!-- Tagline -->
  <text x="80" y="380" font-family="system-ui, -apple-system, sans-serif" font-size="32" fill="white" opacity="0.9">Innovative Medical Aesthetic Devices</text>
  <!-- Subtitle -->
  <text x="80" y="430" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="white" opacity="0.7">FDA 510(k) Cleared | Made in Korea</text>
  <!-- Bottom bar -->
  <rect x="0" y="590" width="1200" height="40" fill="white" opacity="0.1"/>
  <text x="1120" y="618" text-anchor="end" font-family="system-ui, -apple-system, sans-serif" font-size="18" fill="white" opacity="0.6">britzmedi.com</text>
</svg>

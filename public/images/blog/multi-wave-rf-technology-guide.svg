<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <rect width="1200" height="630" fill="#EFF6FF"/>
  <rect width="1200" height="630" fill="url(#bg3)" opacity="0.3"/>
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1200" y2="630">
      <stop offset="0%" stop-color="#1E3A5F"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
  </defs>
  <!-- Multi-wave frequency visualization -->
  <!-- Wave 1: Low frequency (0.5 MHz) -->
  <g opacity="0.7">
    <path d="M60 180 Q120 120 180 180 T300 180 T420 180 T540 180 T660 180 T780 180 T900 180 T1020 180 T1140 180" stroke="#EF4444" stroke-width="3" fill="none"/>
    <text x="60" y="160" font-family="Arial,sans-serif" font-size="13" fill="#EF4444" font-weight="bold">0.5 MHz — Deep Tissue</text>
    <rect x="1050" y="168" width="90" height="24" rx="12" fill="#FEE2E2"/>
    <text x="1065" y="184" font-family="Arial,sans-serif" font-size="11" fill="#EF4444">Body</text>
  </g>
  <!-- Wave 2: Mid frequency (1.0 MHz) -->
  <g opacity="0.8">
    <path d="M60 280 Q90 240 120 280 T180 280 T240 280 T300 280 T360 280 T420 280 T480 280 T540 280 T600 280 T660 280 T720 280 T780 280 T840 280 T900 280 T960 280 T1020 280 T1080 280 T1140 280" stroke="#F59E0B" stroke-width="3" fill="none"/>
    <text x="60" y="260" font-family="Arial,sans-serif" font-size="13" fill="#D97706" font-weight="bold">1.0 MHz — Dermal Layer</text>
    <rect x="1050" y="268" width="90" height="24" rx="12" fill="#FEF3C7"/>
    <text x="1060" y="284" font-family="Arial,sans-serif" font-size="11" fill="#D97706">Dermal</text>
  </g>
  <!-- Wave 3: High frequency (2.0 MHz) -->
  <g opacity="0.9">
    <path d="M60 380 Q75 350 90 380 T120 380 T150 380 T180 380 T210 380 T240 380 T270 380 T300 380 T330 380 T360 380 T390 380 T420 380 T450 380 T480 380 T510 380 T540 380 T570 380 T600 380 T630 380 T660 380 T690 380 T720 380 T750 380 T780 380 T810 380 T840 380 T870 380 T900 380 T930 380 T960 380 T990 380 T1020 380 T1050 380 T1080 380 T1110 380 T1140 380" stroke="#3B82F6" stroke-width="3" fill="none"/>
    <text x="60" y="360" font-family="Arial,sans-serif" font-size="13" fill="#1D4ED8" font-weight="bold">2.0 MHz — Superficial</text>
    <rect x="1050" y="368" width="90" height="24" rx="12" fill="#DBEAFE"/>
    <text x="1058" y="384" font-family="Arial,sans-serif" font-size="11" fill="#1D4ED8">Surface</text>
  </g>
  <!-- Skin layer diagram on right -->
  <g transform="translate(750, 80)">
    <rect x="0" y="0" width="380" height="400" rx="20" fill="white" opacity="0.15"/>
    <!-- Depth indicator -->
    <line x1="30" y1="40" x2="30" y2="380" stroke="white" stroke-width="1" opacity="0.4" stroke-dasharray="4,4"/>
    <text x="40" y="55" font-family="Arial,sans-serif" font-size="11" fill="white" opacity="0.6">0mm</text>
    <text x="40" y="155" font-family="Arial,sans-serif" font-size="11" fill="white" opacity="0.6">2mm</text>
    <text x="40" y="255" font-family="Arial,sans-serif" font-size="11" fill="white" opacity="0.6">4mm</text>
    <text x="40" y="370" font-family="Arial,sans-serif" font-size="11" fill="white" opacity="0.6">8mm</text>
  </g>
  <!-- Center label -->
  <g transform="translate(420, 440)">
    <rect x="0" y="0" width="360" height="60" rx="30" fill="white" opacity="0.95"/>
    <text x="180" y="28" font-family="Arial,sans-serif" font-size="18" font-weight="bold" fill="#0F172A" text-anchor="middle">Multi-Wave RF</text>
    <text x="180" y="48" font-family="Arial,sans-serif" font-size="13" fill="#64748B" text-anchor="middle">3 frequencies, 3 depth layers</text>
  </g>
  <!-- Title area -->
  <rect x="0" y="530" width="1200" height="100" fill="#0F172A" opacity="0.85"/>
  <text x="60" y="575" font-family="Arial,sans-serif" font-size="28" font-weight="bold" fill="white">Multi-Wave RF Technology Guide</text>
  <text x="60" y="605" font-family="Arial,sans-serif" font-size="16" fill="#93C5FD">Complete Guide for Aesthetic Professionals | BRITZMEDI</text>
</svg>

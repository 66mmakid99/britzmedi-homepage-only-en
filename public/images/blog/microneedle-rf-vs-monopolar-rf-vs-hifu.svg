<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <rect width="1200" height="630" fill="#FDF4FF"/>
  <rect width="1200" height="630" fill="url(#bg4)" opacity="0.25"/>
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="1200" y2="630">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="50%" stop-color="#1D4ED8"/>
      <stop offset="100%" stop-color="#0891B2"/>
    </linearGradient>
  </defs>
  <!-- VS dividers -->
  <line x1="400" y1="60" x2="400" y2="470" stroke="#CBD5E1" stroke-width="1" stroke-dasharray="6,4" opacity="0.5"/>
  <line x1="800" y1="60" x2="800" y2="470" stroke="#CBD5E1" stroke-width="1" stroke-dasharray="6,4" opacity="0.5"/>
  <!-- VS badges -->
  <circle cx="400" cy="265" r="24" fill="#0F172A" opacity="0.9"/>
  <text x="400" y="271" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle">VS</text>
  <circle cx="800" cy="265" r="24" fill="#0F172A" opacity="0.9"/>
  <text x="800" y="271" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle">VS</text>
  <!-- Column 1: Microneedle RF -->
  <g transform="translate(40, 60)">
    <rect x="0" y="0" width="320" height="410" rx="20" fill="white" opacity="0.95"/>
    <rect x="0" y="0" width="320" height="8" rx="4" fill="#8B5CF6"/>
    <text x="160" y="50" font-family="Arial,sans-serif" font-size="20" font-weight="bold" fill="#1E293B" text-anchor="middle">Microneedle RF</text>
    <!-- Needle icon -->
    <g transform="translate(120, 70)">
      <line x1="20" y1="10" x2="20" y2="60" stroke="#8B5CF6" stroke-width="2"/>
      <line x1="40" y1="10" x2="40" y2="65" stroke="#8B5CF6" stroke-width="2"/>
      <line x1="60" y1="10" x2="60" y2="58" stroke="#8B5CF6" stroke-width="2"/>
      <rect x="5" y="0" width="70" height="15" rx="4" fill="#8B5CF6" opacity="0.3"/>
      <!-- Energy dots -->
      <circle cx="20" cy="55" r="4" fill="#8B5CF6" opacity="0.6"/>
      <circle cx="40" cy="60" r="4" fill="#8B5CF6" opacity="0.6"/>
      <circle cx="60" cy="53" r="4" fill="#8B5CF6" opacity="0.6"/>
    </g>
    <!-- Stats -->
    <text x="30" y="180" font-family="Arial,sans-serif" font-size="12" fill="#64748B">Depth</text>
    <rect x="100" y="170" width="190" height="12" rx="6" fill="#E2E8F0"/>
    <rect x="100" y="170" width="140" height="12" rx="6" fill="#8B5CF6" opacity="0.7"/>
    <text x="30" y="210" font-family="Arial,sans-serif" font-size="12" fill="#64748B">Precision</text>
    <rect x="100" y="200" width="190" height="12" rx="6" fill="#E2E8F0"/>
    <rect x="100" y="200" width="180" height="12" rx="6" fill="#8B5CF6" opacity="0.7"/>
    <text x="30" y="240" font-family="Arial,sans-serif" font-size="12" fill="#64748B">Recovery</text>
    <rect x="100" y="230" width="190" height="12" rx="6" fill="#E2E8F0"/>
    <rect x="100" y="230" width="100" height="12" rx="6" fill="#F59E0B" opacity="0.7"/>
    <text x="30" y="270" font-family="Arial,sans-serif" font-size="12" fill="#64748B">Cost</text>
    <rect x="100" y="260" width="190" height="12" rx="6" fill="#E2E8F0"/>
    <rect x="100" y="260" width="130" height="12" rx="6" fill="#F59E0B" opacity="0.7"/>
    <!-- Best for -->
    <rect x="30" y="300" width="260" height="80" rx="12" fill="#F5F3FF"/>
    <text x="50" y="325" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#6D28D9">Best for:</text>
    <text x="50" y="345" font-family="Arial,sans-serif" font-size="11" fill="#64748B">Acne scars, skin texture</text>
    <text x="50" y="365" font-family="Arial,sans-serif" font-size="11" fill="#64748B">Facial tightening</text>
  </g>
  <!-- Column 2: Monopolar RF -->
  <g transform="translate(440, 60)">
    <rect x="0" y="0" width="320" height="410" rx="20" fill="white" opacity="0.95"/>
    <rect x="0" y="0" width="320" height="8" rx="4" fill="#3B82F6"/>
    <text x="160" y="50" font-family="Arial,sans-serif" font-size="20" font-weight="bold" fill="#1E293B" text-anchor="middle">Monopolar RF</text>
    <!-- Wave icon -->
    <g transform="translate(100, 80)">
      <path d="M0 30 Q30 0 60 30 T120 30" stroke="#3B82F6" stroke-width="3" fill="none"/>
      <path d="M10 50 Q35 25 60 50 T110 50" stroke="#3B82F6" stroke-width="2" fill="none" opacity="0.5"/>
      <circle cx="60" cy="30" r="20" fill="#3B82F6" opacity="0.1"/>
    </g>
    <text x="30" y="180" font-family="Arial,sans-serif" font-size="12" fill="#64748B">Depth</text>
    <rect x="100" y="170" width="190" height="12" rx="6" fill="#E2E8F0"/>
    <rect x="100" y="170" width="190" height="12" rx="6" fill="#3B82F6" opacity="0.7"/>
    <text x="30" y="210" font-family="Arial,sans-serif" font-size="12" fill="#64748B">Precision</text>
    <rect x="100" y="200" width="190" height="12" rx="6" fill="#E2E8F0"/>
    <rect x="100" y="200" width="120" height="12" rx="6" fill="#3B82F6" opacity="0.7"/>
    <text x="30" y="240" font-family="Arial,sans-serif" font-size="12" fill="#64748B">Recovery</text>
    <rect x="100" y="230" width="190" height="12" rx="6" fill="#E2E8F0"/>
    <rect x="100" y="230" width="170" height="12" rx="6" fill="#22C55E" opacity="0.7"/>
    <text x="30" y="270" font-family="Arial,sans-serif" font-size="12" fill="#64748B">Cost</text>
    <rect x="100" y="260" width="190" height="12" rx="6" fill="#E2E8F0"/>
    <rect x="100" y="260" width="150" height="12" rx="6" fill="#F59E0B" opacity="0.7"/>
    <rect x="30" y="300" width="260" height="80" rx="12" fill="#EFF6FF"/>
    <text x="50" y="325" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#1D4ED8">Best for:</text>
    <text x="50" y="345" font-family="Arial,sans-serif" font-size="11" fill="#64748B">Deep tissue tightening</text>
    <text x="50" y="365" font-family="Arial,sans-serif" font-size="11" fill="#64748B">Body contouring</text>
  </g>
  <!-- Column 3: HIFU -->
  <g transform="translate(840, 60)">
    <rect x="0" y="0" width="320" height="410" rx="20" fill="white" opacity="0.95"/>
    <rect x="0" y="0" width="320" height="8" rx="4" fill="#0891B2"/>
    <text x="160" y="50" font-family="Arial,sans-serif" font-size="20" font-weight="bold" fill="#1E293B" text-anchor="middle">HIFU</text>
    <!-- Ultrasound icon -->
    <g transform="translate(110, 75)">
      <path d="M50 0 L20 50 L80 50 Z" fill="none" stroke="#0891B2" stroke-width="2"/>
      <circle cx="50" cy="55" r="8" fill="#0891B2" opacity="0.3"/>
      <circle cx="50" cy="55" r="4" fill="#0891B2" opacity="0.6"/>
    </g>
    <text x="30" y="180" font-family="Arial,sans-serif" font-size="12" fill="#64748B">Depth</text>
    <rect x="100" y="170" width="190" height="12" rx="6" fill="#E2E8F0"/>
    <rect x="100" y="170" width="170" height="12" rx="6" fill="#0891B2" opacity="0.7"/>
    <text x="30" y="210" font-family="Arial,sans-serif" font-size="12" fill="#64748B">Precision</text>
    <rect x="100" y="200" width="190" height="12" rx="6" fill="#E2E8F0"/>
    <rect x="100" y="200" width="160" height="12" rx="6" fill="#0891B2" opacity="0.7"/>
    <text x="30" y="240" font-family="Arial,sans-serif" font-size="12" fill="#64748B">Recovery</text>
    <rect x="100" y="230" width="190" height="12" rx="6" fill="#E2E8F0"/>
    <rect x="100" y="230" width="150" height="12" rx="6" fill="#22C55E" opacity="0.7"/>
    <text x="30" y="270" font-family="Arial,sans-serif" font-size="12" fill="#64748B">Cost</text>
    <rect x="100" y="260" width="190" height="12" rx="6" fill="#E2E8F0"/>
    <rect x="100" y="260" width="180" height="12" rx="6" fill="#EF4444" opacity="0.6"/>
    <rect x="30" y="300" width="260" height="80" rx="12" fill="#ECFEFF"/>
    <text x="50" y="325" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#0E7490">Best for:</text>
    <text x="50" y="345" font-family="Arial,sans-serif" font-size="11" fill="#64748B">SMAS layer lifting</text>
    <text x="50" y="365" font-family="Arial,sans-serif" font-size="11" fill="#64748B">Non-invasive facelift</text>
  </g>
  <!-- Title area -->
  <rect x="0" y="530" width="1200" height="100" fill="#0F172A" opacity="0.85"/>
  <text x="60" y="575" font-family="Arial,sans-serif" font-size="28" font-weight="bold" fill="white">Microneedle RF vs Monopolar RF vs HIFU</text>
  <text x="60" y="605" font-family="Arial,sans-serif" font-size="16" fill="#93C5FD">Which Is Best for Your Clinic? | BRITZMEDI</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 225" fill="none">
  <rect width="400" height="225" fill="#F0FDF4"/>
  <rect x="0" y="0" width="400" height="225" fill="url(#clinGrad)" opacity="0.2"/>
  <defs>
    <linearGradient id="clinGrad" x1="0" y1="0" x2="400" y2="225">
      <stop offset="0%" stop-color="#22C55E"/>
      <stop offset="100%" stop-color="#15803D"/>
    </linearGradient>
  </defs>
  <!-- Medical cross -->
  <g transform="translate(170, 72)">
    <rect x="20" y="0" width="20" height="60" rx="4" fill="#86EFAC" opacity="0.5"/>
    <rect x="0" y="20" width="60" height="20" rx="4" fill="#86EFAC" opacity="0.5"/>
    <rect x="22" y="2" width="16" height="56" rx="3" fill="#22C55E" opacity="0.2"/>
    <rect x="2" y="22" width="56" height="16" rx="3" fill="#22C55E" opacity="0.2"/>
  </g>
  <!-- Lab flask -->
  <g transform="translate(95, 80)" opacity="0.4">
    <path d="M15 0 L15 25 L0 50 L30 50 L15 25 Z" stroke="#22C55E" stroke-width="1.5" fill="#86EFAC" fill-opacity="0.3"/>
    <line x1="10" y1="0" x2="20" y2="0" stroke="#22C55E" stroke-width="1.5"/>
  </g>
  <!-- Data dots -->
  <g fill="#22C55E" opacity="0.3">
    <circle cx="280" cy="80" r="6"/>
    <circle cx="300" cy="100" r="4"/>
    <circle cx="310" cy="130" r="8"/>
    <circle cx="290" cy="150" r="5"/>

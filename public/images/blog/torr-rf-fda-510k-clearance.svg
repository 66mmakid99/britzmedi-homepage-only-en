<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <rect width="1200" height="630" fill="#FFFBEB"/>
  <rect width="1200" height="630" fill="url(#bg5)" opacity="0.2"/>
  <defs>
    <linearGradient id="bg5" x1="0" y1="0" x2="1200" y2="630">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#164E63"/>
    </linearGradient>
  </defs>
  <!-- FDA seal / badge -->
  <g transform="translate(100, 80)">
    <circle cx="180" cy="180" r="170" fill="white" opacity="0.95"/>
    <circle cx="180" cy="180" r="155" fill="none" stroke="#1D4ED8" stroke-width="3"/>
    <circle cx="180" cy="180" r="145" fill="none" stroke="#1D4ED8" stroke-width="1" stroke-dasharray="4,3"/>
    <!-- Stars -->
    <g fill="#1D4ED8" opacity="0.8">
      <polygon points="180,35 184,47 197,47 187,55 190,67 180,59 170,67 173,55 163,47 176,47"/>
      <polygon points="100,70 103,79 113,79 105,84 108,93 100,88 92,93 95,84 87,79 97,79" transform="scale(0.8) translate(20,20)"/>
      <polygon points="260,70 263,79 273,79 265,84 268,93 260,88 252,93 255,84 247,79 257,79" transform="scale(0.8) translate(70,20)"/>
    </g>
    <!-- FDA text -->
    <text x="180" y="155" font-family="Arial,sans-serif" font-size="52" font-weight="bold" fill="#0F172A" text-anchor="middle">FDA</text>
    <text x="180" y="195" font-family="Arial,sans-serif" font-size="22" fill="#1D4ED8" text-anchor="middle">510(k) Cleared</text>
    <!-- Clearance number -->
    <rect x="90" y="215" width="180" height="36" rx="18" fill="#DBEAFE"/>
    <text x="180" y="238" font-family="Arial,sans-serif" font-size="16" font-weight="bold" fill="#1D4ED8" text-anchor="middle">K212561</text>
    <!-- USA text -->
    <text x="180" y="290" font-family="Arial,sans-serif" font-size="12" fill="#64748B" text-anchor="middle">UNITED STATES OF AMERICA</text>
    <!-- Decorative ring -->
    <path d="M60 310 Q180 340 300 310" fill="none" stroke="#CBD5E1" stroke-width="1"/>
  </g>
  <!-- Right side: Product + Info -->
  <g transform="translate(520, 60)">
    <!-- Product card -->
    <rect x="0" y="0" width="620" height="410" rx="24" fill="white" opacity="0.95"/>
    <!-- Header -->
    <rect x="0" y="0" width="620" height="80" rx="24" fill="#0F172A"/>
    <rect x="0" y="40" width="620" height="40" fill="#0F172A"/>
    <text x="40" y="42" font-family="Arial,sans-serif" font-size="14" fill="#94A3B8">BRITZMEDI Medical Device</text>
    <text x="40" y="68" font-family="Arial,sans-serif" font-size="26" font-weight="bold" fill="white">TORR RF</text>
    <!-- Checkmarks -->
    <g transform="translate(40, 100)">
      <circle cx="12" cy="12" r="12" fill="#DCFCE7"/>
      <path d="M7 12 L10 15 L17 8" stroke="#16A34A" stroke-width="2.5" fill="none"/>
      <text x="35" y="17" font-family="Arial,sans-serif" font-size="15" fill="#1E293B">FDA 510(k) Clearance — Substantial Equivalence</text>
    </g>
    <g transform="translate(40, 145)">
      <circle cx="12" cy="12" r="12" fill="#DCFCE7"/>
      <path d="M7 12 L10 15 L17 8" stroke="#16A34A" stroke-width="2.5" fill="none"/>
      <text x="35" y="17" font-family="Arial,sans-serif" font-size="15" fill="#1E293B">ISO 13485:2016 Quality Management System</text>
    </g>
    <g transform="translate(40, 190)">
      <circle cx="12" cy="12" r="12" fill="#DCFCE7"/>
      <path d="M7 12 L10 15 L17 8" stroke="#16A34A" stroke-width="2.5" fill="none"/>
      <text x="35" y="17" font-family="Arial,sans-serif" font-size="15" fill="#1E293B">CE Mark — European Conformity</text>
    </g>
    <g transform="translate(40, 235)">
      <circle cx="12" cy="12" r="12" fill="#DCFCE7"/>
      <path d="M7 12 L10 15 L17 8" stroke="#16A34A" stroke-width="2.5" fill="none"/>
      <text x="35" y="17" font-family="Arial,sans-serif" font-size="15" fill="#1E293B">KGMP — Korean Good Manufacturing Practice</text>
    </g>
    <!-- Key specs -->
    <line x1="40" y1="280" x2="580" y2="280" stroke="#E2E8F0" stroke-width="1"/>
    <g transform="translate(40, 300)">
      <rect x="0" y="0" width="160" height="80" rx="12" fill="#F8FAFC"/>
      <text x="80" y="30" font-family="Arial,sans-serif" font-size="11" fill="#64748B" text-anchor="middle">Classification</text>
      <text x="80" y="55" font-family="Arial,sans-serif" font-size="18" font-weight="bold" fill="#0F172A" text-anchor="middle">Class II</text>
    </g>
    <g transform="translate(180, 300)">
      <rect x="0" y="0" width="160" height="80" rx="12" fill="#F8FAFC"/>
      <text x="80" y="30" font-family="Arial,sans-serif" font-size="11" fill="#64748B" text-anchor="middle">Product Code</text>
      <text x="80" y="55" font-family="Arial,sans-serif" font-size="18" font-weight="bold" fill="#0F172A" text-anchor="middle">QBJ</text>
    </g>
    <g transform="translate(360, 300)">
      <rect x="0" y="0" width="200" height="80" rx="12" fill="#F8FAFC"/>
      <text x="100" y="30" font-family="Arial,sans-serif" font-size="11" fill="#64748B" text-anchor="middle">Indication</text>
      <text x="100" y="55" font-family="Arial,sans-serif" font-size="15" font-weight="bold" fill="#0F172A" text-anchor="middle">Dermatologic Use</text>
    </g>
  </g>
  <!-- Title area -->
  <rect x="0" y="530" width="1200" height="100" fill="#0F172A" opacity="0.85"/>
  <text x="60" y="575" font-family="Arial,sans-serif" font-size="28" font-weight="bold" fill="white">TORR RF: FDA 510(k) Clearance Guide</text>
  <text x="60" y="605" font-family="Arial,sans-serif" font-size="16" fill="#93C5FD">What It Means for Your Practice | BRITZMEDI</text>
</svg>
